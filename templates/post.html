{% extends "layout.html" %}

{% block content %}
    <article class="card shadow-sm border-0 bg-body-tertiary">
        <div class="card-body p-4">
            <a href="{{ url_for('posts') }}" class="btn btn-outline-secondary btn-sm mb-4">
                &larr; Back to posts
            </a>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="badge bg-secondary-subtle text-secondary-emphasis">{{ post.author }}</span>
                <time class="text-body-secondary">{{ post.date_posted }}</time>
            </div>

            <h1 class="h2 card-title fw-bold mb-4">{{ post.title }}</h1>
            <p class="card-text text-body-secondary mb-0">{{ post.content }}</p>
        </div>
    </article>
{% endblock content %}
