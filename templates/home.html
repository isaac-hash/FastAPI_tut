{% extends "layout.html" %}

{% block content %}
    <h2 class="mb-4 fw-bold">Recent Articles</h2>
    {% for post in posts %}
        <article class="card shadow-sm border-0 mb-4 bg-body-tertiary">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="badge bg-secondary-subtle text-secondary-emphasis">{{ post.author }}</span>
                    <small class="text-body-secondary">{{ post.date_posted }}</small>
                </div>
                <h4 class="card-title fw-semibold"> <a href="{{ url_for("post_page", post_id=post.id) }}">{{ post.title }}</a></h4>
                <p class="card-text text-body-secondary">{{ post.content }}</p>
                <a href="{{ url_for("post_page", post_id=post.id) }}" class="btn btn-outline-primary btn-sm">Read more &rarr;</a>
            </div>
        </article>
    {% endfor %}
{% endblock content %}
